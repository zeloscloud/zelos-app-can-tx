name = "CAN Transmit"
version = "0.2.0"
description = "Send CAN and CAN-FD frames from a Zelos tab: raw bytes or DBC messages with signals, one-shot or periodic, with live receive counters and transmit errors per bus. Needs the CAN extension running."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-app-can-tx"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["can", "can-bus", "can-fd", "transmit", "send", "tx", "dbc", "periodic", "automotive", "canfd", "can fd", "sender", "transmitter", "cansend", "cyclic", "extended id", "29-bit", "frame"]
categories = ["Automotive", "Networking"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[app]
tab = "dist/tab/index.html"

[package]
paths = ["LICENSE", "dist"]
