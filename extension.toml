name = "CAN Transmit"
version = "0.1.0"
description = "Transmit CAN frames (raw + DBC, one-shot + periodic) through the Zelos CAN agent extension."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-app-can-tx"
icon = "assets/icon.png"
readme = "README.md"

# Compatibility — pinned to the host that ships the actions.* / extensions.list
# bridge surface. The extensions.start/stop server side will land in 26.0.5+;
# until 26.0.5-alpha is cut, we keep the pin at 26.0.4 so the app can install
# against the current released host. The ExtensionToggle gracefully degrades
# if start/stop dispatchers are absent (returns an "unknown method" error
# that the toast surface presents to the user).
[zelos]
version = ">=26.0.4"

[host]
type = "app"

[host.app]
kind = "web_app"
entry = "dist/index.html"

[package]
paths = ["dist"]

# This app drives the CAN agent extension exclusively. The host should surface a
# clear "missing dependency" state at install time if the required extension is
# not present, instead of leaving the user with a useless "extension missing"
# banner.
[[requires]]
extension = "zeloscloud.zelos-extension-can"
version = ">=0.1.12"
